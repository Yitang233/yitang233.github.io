name: visitors
on:
  schedule: [{ cron: '17 5 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch country totals
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python3 -I .github/scripts/visitors.py muxidixi
      - name: Commit if changed
        run: |
          git config user.name "visitors-bot"
          git config user.email "visitors-bot@users.noreply.github.com"
          git add v/visitors.json
          git diff --cached --quiet || (git commit -m "Update visitor countries" && git push)
